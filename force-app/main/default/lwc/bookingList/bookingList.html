<template>
    <lightning-card title="My Food Plan Bookings" icon-name="standard:event">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading Bookings"></lightning-spinner>
        </template>
        <div class="slds-m-around_medium">
            <template if:true={bookings.length}>
                <div class="slds-grid slds-wrap slds-gutters">
                    <template for:each={bookings} for:item="b">
                        <div key={b.Id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_medium">
                            <div class="slds-box slds-box_small">
                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                                    <h3 class="slds-text-heading_small">{b.Name}</h3>
                                    <span class="slds-badge slds-theme_success">{b.Status__c}</span>
                                </div>
                                <p><strong>Plan:</strong> {b.Plan__r.Name}</p>
                                <p><strong>User:</strong> {b.User__r.Name}</p>
                                <p><strong>Amount Paid:</strong> ${b.Price__c}</p>
                                <div class="slds-m-top_small">
                                    <lightning-button label="Cancel Booking" variant="destructive-text" data-id={b.Id} onclick={handleCancelBooking}></lightning-button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <template if:false={bookings.length}>
                <p class="slds-text-color_weak">No bookings found.</p>
            </template>
        </div>
    </lightning-card>
</template>
