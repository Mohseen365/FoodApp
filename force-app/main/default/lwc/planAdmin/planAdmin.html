<template>
    <lightning-card title="Plan Administration" icon-name="standard:service_contract">
        <div slot="actions">
            <lightning-button label="New Plan" variant="brand" icon-name="utility:add" onclick={openCreateModal}></lightning-button>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Processing"></lightning-spinner>
        </template>

        <div class="slds-m-around_medium">
            <template if:true={plans.length}>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col">Name</th>
                            <th scope="col">Price ($)</th>
                            <th scope="col">Duration (Days)</th>
                            <th scope="col">Discount (%)</th>
                            <th scope="col">Rating</th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={plans} for:item="p">
                            <tr key={p.Id}>
                                <td>{p.Name}</td>
                                <td>{p.Price__c}</td>
                                <td>{p.Duration__c}</td>
                                <td>{p.Discount__c}</td>
                                <td>{p.RatingsAverage__c}</td>
                                <td>
                                    <lightning-button-icon icon-name="utility:edit" alternative-text="Edit" data-id={p.Id} onclick={openEditModal} class="slds-m-right_x-small"></lightning-button-icon>
                                    <lightning-button-icon icon-name="utility:delete" alternative-text="Delete" data-id={p.Id} onclick={handleDeletePlan} variant="border-filled"></lightning-button-icon>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
        </div>

        <!-- Create/Edit Plan Modal -->
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">{modalTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input label="Plan Name" value={planName} data-field="planName" onchange={handleInputChange} required></lightning-input>
                        <lightning-input label="Price" type="number" formatter="currency" value={planPrice} data-field="planPrice" onchange={handleInputChange} required></lightning-input>
                        <lightning-input label="Duration (Days)" type="number" value={planDuration} data-field="planDuration" onchange={handleInputChange} required></lightning-input>
                        <lightning-input label="Discount (%)" type="number" value={planDiscount} data-field="planDiscount" onchange={handleInputChange}></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button label="Save Plan" variant="brand" onclick={handleSavePlan}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
