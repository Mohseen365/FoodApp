<template>
    <lightning-card title="Plan Details" icon-name="standard:product">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </template>

        <div class="slds-m-around_medium">
            <template if:true={plan}>
                <div class="slds-box slds-m-bottom_medium">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">{plan.Name}</h2>
                    <p class="slds-text-body_regular"><strong>Price:</strong> ${plan.Price__c}</p>
                    <p class="slds-text-body_regular"><strong>Duration:</strong> {plan.Duration__c} Days</p>
                    <template if:true={plan.Discount__c}>
                        <p class="slds-text-body_regular"><strong>Discount:</strong> {plan.Discount__c}%</p>
                    </template>
                    <template if:true={plan.RatingsAverage__c}>
                        <p class="slds-text-body_regular"><strong>Average Rating:</strong> {plan.RatingsAverage__c} / 5</p>
                    </template>
                </div>

                <!-- Add Review Section -->
                <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Write a Review</h3>
                    <lightning-textarea label="Your Review" value={reviewText} onchange={handleReviewChange}></lightning-textarea>
                    <lightning-combobox label="Rating" value={ratingValue} options={ratingOptions} onchange={handleRatingChange} class="slds-m-vertical_small"></lightning-combobox>
                    <lightning-button label="Submit Review" variant="brand" onclick={handleAddReview}></lightning-button>
                </div>

                <!-- Reviews List Section -->
                <h3 class="slds-text-heading_small slds-m-bottom_small">Reviews</h3>
                <template if:true={reviews.length}>
                    <template for:each={reviews} for:item="rev">
                        <div key={rev.Id} class="slds-box slds-m-bottom_small">
                            <div class="slds-grid slds-grid_align-spread">
                                <div>
                                    <p class="slds-text-title_bold">{rev.User__r.Name}</p>
                                    <p class="slds-m-vertical_x-small">{rev.Review__c}</p>
                                    <span class="slds-badge slds-theme_info">Rating: {rev.Rating__c}/5</span>
                                </div>
                                <div>
                                    <lightning-button-icon icon-name="utility:delete" alternative-text="Delete" data-id={rev.Id} onclick={handleDeleteReview}></lightning-button-icon>
                                </div>
                            </div>
                        </div>
                    </template>
                </template>
                <template if:false={reviews.length}>
                    <p class="slds-text-color_weak">No reviews yet for this plan.</p>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
